<div class="share">
  <label for="share-url">Share link</label>
  <div class="share-row">
    <input type="text" id="share-url" value="{{ share_url }}" readonly>
    <button type="button" class="btn btn-light" id="copy-link">Copy link</button>
  </div>
  <p class="copy-status" id="copy-status" aria-live="polite"></p>
</div>
