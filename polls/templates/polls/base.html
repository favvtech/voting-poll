{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Live Poll{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'polls/styles.css' %}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="{% url 'polls:home' %}">Live Poll</a>
      <a class="nav-link" href="{% url 'polls:home' %}">New poll</a>
    </div>
  </header>

  <main class="wrap {% block main_class %}narrow{% endblock %}">
    {% if messages %}
      {% for message in messages %}
        <p class="flash {{ message.tags }}">{{ message }}</p>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
